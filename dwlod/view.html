<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKITDA General Body 2025 - Registered Members</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .table-auto th, .table-auto td {
            border: 1px solid #e2e8f0;
            padding: 12px 15px;
        }
    </style>
</head>
<body class="bg-gray-100 p-4 sm:p-8">

    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg w-full max-w-6xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Registered Members</h1>
            <p class="text-gray-600 mt-2">AKITDA General Body 2025</p>
        </div>
        
        <div class="flex justify-between items-center mb-4">
            <div>
                <span class="text-lg font-semibold">Total Registrations: <span id="memberCount">0</span></span>
            </div>
            <div>
                <button id="refreshBtn" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-300">Refresh</button>
            </div>
        </div>

        <div id="loadingMessage" class="text-center py-10">
            <p class="text-lg text-gray-600">Loading registrations...</p>
        </div>
        
        <div id="errorMessage" class="hidden text-center py-10 bg-red-50 text-red-600 rounded-lg">
            <p id="errorText"></p>
        </div>

        <div class="overflow-x-auto">
            <table id="membersTable" class="min-w-full table-auto text-left hidden">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="font-semibold text-gray-700">#</th>
                        <th class="font-semibold text-gray-700">Name</th>
                        <th class="font-semibold text-gray-700">Company</th>
                        <th class="font-semibold text-gray-700">Designation</th>
                        <th class="font-semibold text-gray-700">District</th>
                        <th class="font-semibold text-gray-700">Phone</th>
                        <th class="font-semibold text-gray-700">Email</th>
                        <th class="font-semibold text-gray-700">Timestamp</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="bg-white">
                    <!-- Data will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // IMPORTANT: PASTE YOUR GOOGLE APPS SCRIPT URL HERE
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxsf5fDxA0l9vLX0ClcPVEjzMRPzSy78-YnotsiYBVmh7Mdqbqjn9MR0RhDvrgwrqz6/exec';

            const table = document.getElementById('membersTable');
            const tableBody = document.getElementById('tableBody');
            const loadingMessage = document.getElementById('loadingMessage');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const memberCount = document.getElementById('memberCount');
            const refreshBtn = document.getElementById('refreshBtn');

            // Check if the script URL has been replaced.
            if (SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL' || !SCRIPT_URL) {
                loadingMessage.style.display = 'none';
                errorText.innerHTML = `<b>Configuration Needed:</b> Please open this file in a text editor and replace 'YOUR_GOOGLE_APPS_SCRIPT_URL' with the actual URL you received after deploying your Google Apps Script.`;
                errorMessage.classList.remove('hidden');
                refreshBtn.disabled = true;
                return; // Stop the script from running further.
            }

            function fetchRegistrations() {
                loadingMessage.style.display = 'block';
                table.classList.add('hidden');
                errorMessage.classList.add('hidden');
                refreshBtn.disabled = true;
                refreshBtn.textContent = 'Refreshing...';

                fetch(SCRIPT_URL)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Network response was not ok (status: ${response.status})`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.status !== 'success') {
                           throw new Error(data.message || 'Failed to fetch data.');
                        }
                        
                        tableBody.innerHTML = ''; // Clear existing data
                        const registrations = data.data;
                        
                        memberCount.textContent = registrations.length;

                        if (registrations.length === 0) {
                           loadingMessage.textContent = 'No registrations yet.';
                           return;
                        }

                        registrations.forEach((row, index) => {
                            const tr = document.createElement('tr');
                            // Timestamp, Name, Company, Designation, District, Phone, Email
                            tr.innerHTML = `
                                <td class="text-gray-600">${index + 1}</td>
                                <td class="font-medium text-gray-800">${row[1] || ''}</td>
                                <td class="text-gray-600">${row[2] || ''}</td>
                                <td class="text-gray-600">${row[3] || ''}</td>
                                <td class="text-gray-600">${row[4] || ''}</td>
                                <td class="text-gray-600">${row[5] || ''}</td>
                                <td class="text-gray-600">${row[6] || ''}</td>
                                <td class="text-gray-500 text-sm">${new Date(row[0]).toLocaleString()}</td>
                            `;
                            tableBody.appendChild(tr);
                        });

                        loadingMessage.style.display = 'none';
                        table.classList.remove('hidden');
                    })
                    .catch(error => {
                        console.error('Error fetching data:', error);
                        loadingMessage.style.display = 'none';
                        errorText.textContent = `Error: ${error.message}. Please check that the script URL is correct and that you have given 'Anyone' access in the deployment settings.`;
                        errorMessage.classList.remove('hidden');
                    })
                    .finally(() => {
                        refreshBtn.disabled = false;
                        refreshBtn.textContent = 'Refresh';
                    });
            }
            
            refreshBtn.addEventListener('click', fetchRegistrations);

            // Initial data fetch
            fetchRegistrations();
        });
    </script>
</body>
</html>
