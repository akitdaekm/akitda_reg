<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKITDA Badge Scanner & Printer (USB)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Print-specific styles */
        @media print {
            /* NEW: Force the viewport size to 60mm */
            html, body {
                width: 60mm;
                height: 60mm;
                margin: 0;
                padding: 0;
                overflow: hidden; /* Be explicit */
            }

            body * {
                visibility: hidden;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                /* NEW: Change position and size */
                position: fixed; 
                left: 0;
                top: 0;
                width: 100%; /* Fill the 60mm viewport */
                height: 100%; /* Fill the 60mm viewport */

                /* Use box-sizing to include padding in the 100% */
                box-sizing: border-box; 
                /* Create a 1mm "safe" padding inside the box */
                padding: 1mm; 
                
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                overflow: hidden; /* Prevent any overflow */
                break-inside: avoid; /* Force browser not to split this */
            }
            #print-qrcode-container canvas {
                 /* Set to desired final size */
                 width: 30mm !important;
                 height: 30mm !important;
            }
            #print-details {
                font-size: 10pt !important;
                margin-top: 1.5mm; /* Space between QR and text */
                text-align: center; /* Center all text lines */
            }
        }
        @page {
            /* Set page size to 60mm x 60mm */
            size: 60mm 60mm;
            /* Set margin to 0 */
            margin: 0mm;
        }
    </style>
</head>
<body class="bg-gray-200 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg w-full max-w-xl mx-auto">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">AKITDA Badge Scanner (USB)</h1>
            <p class="text-gray-600">Click the box below and begin scanning badges.</p>
        </div>

        <!-- Scanner Input -->
        <div class="my-4">
            <input type="text" id="scannerInput" placeholder="Click here and scan a badge..." class="w-full text-center px-4 py-3 border-2 border-dashed border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-lg">
        </div>

        <!-- Status & Instructions -->
        <div class="text-center p-4 bg-gray-50 rounded-lg min-h-[6rem]">
            <p id="statusMessage" class="font-medium text-gray-700 text-lg">Waiting for scan...</p>
        </div>
        <div class="mt-4">
             <h3 class="text-sm font-medium text-gray-700 text-center">Printer Setup:</h3>
             <p class="text-xs text-gray-600 mt-1 text-center">Ensure your label printer is set as the default printer in your computer's System Settings.</p>
        </div>
    </div>

    <!-- Hidden area for printing -->
    <div id="print-area" class="hidden">
        <div id="print-qrcode-container" class="text-center"></div>
        <div id="print-details" class="text-center font-sans"></div>
    </div>

    <!-- Scripts at the end of the body -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const scannerInput = document.getElementById('scannerInput');
            const statusMessage = document.getElementById('statusMessage');
            const printQRCodeContainer = document.getElementById('print-qrcode-container');
            const printDetailsContainer = document.getElementById('print-details');
            
            let wakeLock = null;

            // --- WAKE LOCK ---
            const requestWakeLock = async () => {
                if ('wakeLock' in navigator) {
                    try {
                        wakeLock = await navigator.wakeLock.request('screen');
                        console.log('Screen Wake Lock is active.');
                        statusMessage.textContent = 'Scanner Ready (Screen awake)';
                    } catch (err) {
                        console.log('Could not acquire wake lock:', err.message);
                        statusMessage.textContent = 'Scanner Ready';
                    }
                }
            };
            
            // Request wake lock when the user clicks the input
            scannerInput.addEventListener('focus', requestWakeLock);

            // --- SCANNER INPUT LISTENER ---
            scannerInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault(); // Prevents form submission
                    const scannedData = scannerInput.value.trim();
                    if (scannedData) {
                        handleScannedCode(scannedData);
                    }
                }
            });
            
            function handleScannedCode(data) {
                statusMessage.textContent = 'Code detected! Processing...';
                
                try {
                    const parts = data.split('|');
                    if (parts.length < 5) { // Expect at least 5 parts
                        throw new Error("Invalid QR code format. Not enough data parts.");
                    }
                    const [name, company, designation, district, phone] = parts;
                    
                    // --- QR Code Generation ---
                    printQRCodeContainer.innerHTML = '';
                    
                    // Set QR code size based on 30mm @ 300dpi (approx 354px)
                    // But qrcode.js uses screen pixels, so we use a relative size
                    // and let the CSS force it to 30mm. 
                    // 118px is approx 30mm at 96dpi, which is a common screen default.
                    const qrSize = 118; 

                    new QRCode(printQRCodeContainer, {
                        text: data,
                        width: qrSize,
                        height: qrSize,
                        correctLevel: QRCode.CorrectLevel.H // High error correction is crucial for this
                    });

                    // --- Text Details ---
                    printDetailsContainer.innerHTML = `
                        <p style="font-weight: bold; font-size: 17pt; margin: 0; line-height: 1.1;">${name}</p>
                        <p style="font-weight: bold; font-size: 11pt; margin: 0; line-height: 1.1;">${company}</p>
                        <p style="font-weight: bold; font-size: 17pt; margin: 0; line-height: 1.1;">${designation}</p>
                    `;
                    
                    // --- Poll for QR Code Image ---
                    // We must wait for the QR code <img> to be generated before we can draw on it.
                    // This is more reliable than setTimeout.
                    const pollForQRCode = (callback) => {
                        const qrImg = printQRCodeContainer.querySelector('img');
                        if (qrImg && qrImg.src) {
                            // Image is ready, proceed
                            callback(qrImg);
                        } else {
                            // Image not ready, check again in 50ms
                            setTimeout(() => pollForQRCode(callback), 50);
                        }
                    };

                    // --- Start polling ---
                    pollForQRCode((qrImg) => {
                        // QR image is now ready, we can draw on it
                        const canvas = document.createElement('canvas');
                        const size = qrSize; // Use the same size as the QR code
                        canvas.width = size;
                        canvas.height = size;
                        const ctx = canvas.getContext('2d');
                        const img = new Image();
                        img.src = qrImg.src;
                        
                        img.onload = function () {
                            // Draw QR Code
                            ctx.drawImage(img, 0, 0);

                            // --- Prepare text overlay (NEW: Larger, Blue, Bordered) ---
                            const centerX = canvas.width / 2;
                            const centerY = canvas.height / 2;
                            const text = "AKITDA";
                            ctx.font = 'bold 12px Inter, sans-serif'; // Larger font
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            const textMetrics = ctx.measureText(text);

                            // Draw background rect for text (WHITE)
                            ctx.fillStyle = 'white'; // Use white background
                            ctx.fillRect(centerX - textMetrics.width / 2 - 4, centerY - 12 / 2 - 2, textMetrics.width + 8, 12 + 4);
                            
                            // Draw text (DARK BLUE)
                            ctx.fillStyle = '#00008B'; // Use dark blue text
                            ctx.fillText(text, centerX, centerY);
                            
                            // Draw border around the QR Code
                            ctx.strokeStyle = 'black';
                            ctx.lineWidth = 1; // A thin border
                            ctx.strokeRect(0, 0, size, size); // Draw border on the edge
                            
                            // --- End of text overlay ---
                            
                            // Replace original QR image with this new canvas
                            printQRCodeContainer.innerHTML = ''; 
                            printQRCodeContainer.appendChild(canvas);
                            
                            // Now, trigger print
                            statusMessage.textContent = 'Printing badge for '.concat(name);
                            
                            // Use requestAnimationFrame for smoother printing
                            requestAnimationFrame(() => {
                                window.print();
                                resetScanner();
                            });
                        }
                        
                        img.onerror = function() {
                            statusMessage.textContent = "Error loading QR code for canvas.";
                            setTimeout(resetScanner, 2000);
                        }
                    });

                } catch (error) {
                    console.error("Failed to parse code:", error);
                    statusMessage.textContent = "Error: Invalid code format. Please try again.";
                    setTimeout(resetScanner, 2000);
                }
            }

            function resetScanner() {
                scannerInput.value = ''; // Clear the input
                scannerInput.focus(); // Set focus back to the input
                statusMessage.textContent = 'Waiting for scan...';
            }

            // Initially focus the input
            scannerInput.focus();
        });
    </script>
</body>
</html>
