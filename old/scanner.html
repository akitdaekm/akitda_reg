<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKITDA Badge Scanner & Printer (USB)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* * NEW PRINT STYLES - 25-Oct-2025
         * New strategy: We will size everything perfectly in CSS.
         * User must print at 100% scale (Default).
         * This avoids the buggy 120% browser scaling.
        */
        @media print {
            /* NEW: Force the viewport size */
            html, body {
                width: 60mm;
                height: 60mm;
                margin: 0;
                padding: 0;
                overflow: hidden; /* Be explicit */
            }

            body * {
                visibility: hidden;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                /* NEW: Change position and size */
                position: fixed; /* Was 'absolute' */
                left: 0;
                top: 0;
                width: 100%; /* Was 59.8mm */
                height: 100%; /* Was 59.8mm */

                /* Use box-sizing to include padding in the 100% */
                box-sizing: border-box; 
                /* Create a 1mm "safe" padding inside the box */
                padding: 1mm; 
                
                /* REMOVED BORDER, it might be the problem */
                /* border: 2px solid black; */
                
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                overflow: hidden; /* Prevent any overflow */
                break-inside: avoid; /* Force browser not to split this */
            }
            #print-qrcode-container canvas {
                 /* Set to desired final size */
                 width: 30mm !important; 
                 height: 30mm !important;
            }
            #print-details {
                /* Set to desired final size */
                margin-top: 1.5mm; 
                text-align: center;
            }
            #print-details p {
                line-height: 1.2;
                margin: 0;
                padding: 0;
            }
        }
        @page {
            /* Match the printer's paper size */
            size: 60mm 60mm;
            margin: 0;
        }
    </style>
</head>
<body class="bg-gray-200 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg w-full max-w-xl mx-auto">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">AKITDA Badge Scanner (USB)</h1>
            <p class="text-gray-600">Click the box below and begin scanning badges.</p>
        </div>

        <!-- Scanner Input -->
        <div class="my-4">
            <input type="text" id="scannerInput" placeholder="Click here and scan a badge..." class="w-full text-center px-4 py-3 border-2 border-dashed border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-lg">
        </div>

        <!-- Status & Instructions -->
        <div class="text-center p-4 bg-gray-50 rounded-lg min-h-[6rem]">
            <p id="statusMessage" class="font-medium text-gray-700 text-lg">Waiting for scan...</p>
        </div>
        <div class="mt-4">
             <h3 class="text-sm font-medium text-gray-700 text-center">Printer Setup:</h3>
             <p class="text-xs text-gray-600 mt-1 text-center">Ensure your label printer is set as the default printer in your computer's System Settings.</p>
        </div>
    </div>

    <!-- Hidden area for printing -->
    <div id="print-area" class="hidden">
        <div id="print-qrcode-container" class="text-center"></div>
        <div id="print-details" class="text-center font-sans">
            <!-- Content is populated by JS -->
        </div>
    </div>

    <!-- Scripts at the end of the body -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const scannerInput = document.getElementById('scannerInput');
            const statusMessage = document.getElementById('statusMessage');
            const printQRCodeContainer = document.getElementById('print-qrcode-container');
            const printDetailsContainer = document.getElementById('print-details');
            
            let wakeLock = null;

            // --- WAKE LOCK ---
            const requestWakeLock = async () => {
                if ('wakeLock' in navigator) {
                    try {
                        wakeLock = await navigator.wakeLock.request('screen');
                        console.log('Screen Wake Lock is active.');
                        statusMessage.textContent = 'Scanner Ready (Screen awake)';
                    } catch (err) {
                        console.log('Could not acquire wake lock:', err.message);
                        statusMessage.textContent = 'Scanner Ready';
                    }
                }
            };
            
            // Request wake lock when the user clicks the input
            scannerInput.addEventListener('focus', requestWakeLock);

            // --- SCANNER INPUT LISTENER ---
            scannerInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault(); // Prevents form submission
                    const scannedData = scannerInput.value.trim();
                    if (scannedData) {
                        handleScannedCode(scannedData);
                    }
                }
            });
            
            function handleScannedCode(data) {
                statusMessage.textContent = 'Code detected! Processing...';
                
                try {
                    const parts = data.split('|');
                    if (parts.length < 3) { 
                        throw new Error("Invalid QR code format. Not enough data parts.");
                    }
                    const [name, company, designation] = parts.slice(0, 3);

                    // --- Prepare for printing ---
                    printQRCodeContainer.innerHTML = '';
                    // 114px (approx 30mm)
                    const qrSize = 114; 
                    
                    new QRCode(printQRCodeContainer, {
                        text: data,
                        width: qrSize, 
                        height: qrSize,
                        correctLevel: QRCode.CorrectLevel.H
                    });

                    // Populate the details for printing (Full size fonts)
                    printDetailsContainer.innerHTML = `
                        <p style="font-weight: bold; font-size: 17pt;">${name}</p>
                        <p style="font-weight: bold; font-size: 11pt;">${company}</p>
                        <p style="font-weight: bold; font-size: 17pt;">${designation}</p>
                    `;
                    
                    // NEW: Replace the simple 100ms timeout with a robust polling function
                    // This waits for the QR code image to be ready before proceeding,
                    // which is crucial for browsers like Edge.
                    
                    let attemptCounter = 0;
                    
                    function drawOverlayAndPrint() {
                        attemptCounter++;
                        const qrImg = printQRCodeContainer.querySelector('img');

                        // Check if the qr code image is ready
                        if (qrImg && qrImg.src) {
                            // --- Image is ready, proceed ---
                            const canvas = document.createElement('canvas');
                            const size = qrSize; // 114
                            canvas.width = size;
                            canvas.height = size;
                            const ctx = canvas.getContext('2d');
                            const img = new Image();
                            img.src = qrImg.src;
                            
                            img.onload = function () {
                                ctx.drawImage(img, 0, 0);

                                // Full size text
                                const centerX = canvas.width / 2;
                                const centerY = canvas.height / 2;
                                const text = "AKITDA";
                                ctx.font = 'bold 12px Inter, sans-serif'; // 12px
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                const textMetrics = ctx.measureText(text);

                                // Full size background rect
                                ctx.fillStyle = 'black';
                                ctx.fillRect(centerX - textMetrics.width / 2 - 4, centerY - 12 / 2 - 2, textMetrics.width + 8, 12 + 4); 
                                
                                ctx.fillStyle = 'white';
                                ctx.fillText(text, centerX, centerY);
                                
                                ctx.strokeStyle = 'black';
                                ctx.lineWidth = 2; 
                                ctx.strokeRect(1, 1, size - 2, size - 2); 

                                printQRCodeContainer.innerHTML = ''; 
                                printQRCodeContainer.appendChild(canvas);
                                
                                statusMessage.textContent = 'Printing badge for ' + name;
                                // Use requestAnimationFrame to wait for render before printing
                                requestAnimationFrame(() => {
                                    requestAnimationFrame(() => {
                                        window.print();
                                        resetScanner();
                                    });
                                });
                            };
                            
                            img.onerror = function() {
                                console.error("Failed to load QR img src for canvas drawing.");
                                statusMessage.textContent = "Error: QR draw failed. Retrying.";
                                setTimeout(resetScanner, 2000);
                            };

                        } else if (attemptCounter < 40) { // Try for ~2 seconds (40 * 50ms)
                            // --- Image not ready, wait and try again ---
                            setTimeout(drawOverlayAndPrint, 50); 
                        
                        } else {
                            // --- Failed to find image after 2 seconds ---
                            console.error("Failed to find generated QR code image.");
                            statusMessage.textContent = "Error: QR generation failed. Please try again.";
                            setTimeout(resetScanner, 2000);
                        }
                    }
                    
                    // Start the process
                    drawOverlayAndPrint();

                } catch (error) {
                    console.error("Failed to parse code:", error);
                    statusMessage.textContent = "Error: Invalid code format. Please try again.";
                    setTimeout(resetScanner, 2000);
                }
            }

            function resetScanner() {
                scannerInput.value = ''; 
                scannerInput.focus(); 
                statusMessage.textContent = 'Waiting for scan...';
            }

            scannerInput.focus();
        });
    </script>
</body>
</html>
