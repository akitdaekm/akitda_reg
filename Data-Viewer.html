<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#080c14">
    <title>AKITDA Scanned Attendance Data Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #080c14;
            color: #f1f5f9;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        @media screen and (max-width: 768px) {
            input, select, textarea { font-size: 16px !important; }
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="p-4 sm:p-8 min-h-screen antialiased selection:bg-cyan-500 selection:text-slate-950">

    <div class="bg-slate-900/90 backdrop-blur-xl p-6 sm:p-8 rounded-3xl shadow-2xl w-full max-w-6xl mx-auto border border-slate-800">
        
        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-5 border-b border-slate-800">
            <div class="flex items-center space-x-3">
                <div class="p-1 rounded-xl bg-gradient-to-tr from-emerald-500 via-teal-400 to-cyan-400 p-[1.5px] shadow-lg shadow-emerald-500/20">
                    <img src="/static/akitda-logo.png" alt="AKITDA" class="h-9 w-auto bg-white p-1 rounded-lg" onerror="this.src='akitda-logo.png'">
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">AKITDA Scanned Data Viewer</h1>
                    <p class="text-xs text-slate-400">General Body 2026 (10th December 2026) • Real-time Attendance & Check-in Database</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <a href="/" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-3.5 py-2 rounded-xl border border-slate-700 transition">
                    ← Main Hub
                </a>
                <a href="/scan" target="_blank" class="text-xs bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-400 hover:to-amber-500 text-white font-bold px-3.5 py-2 rounded-xl shadow-lg shadow-orange-500/20 transition">
                    ⚡ Open Scanner
                </a>
            </div>
        </div>
        
        <!-- Status & Controls Bar -->
        <div class="mb-6 p-5 bg-slate-950/80 rounded-2xl border border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-xl">
            <div class="flex items-center space-x-3">
                <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
                <div>
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Total Scanned Attendees</span>
                    <div id="totalScanBadge" class="text-3xl font-extrabold text-emerald-400 mt-0.5">0</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-2">
                <button id="fetchDataBtn" onclick="loadScannedData()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition shadow">
                    🔄 Refresh Data
                </button>
                <a href="/api/export/csv" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow-lg transition inline-flex items-center gap-1">
                    📥 Download CSV (.csv)
                </a>
                <button onclick="confirmDeleteAll()" class="px-4 py-2 bg-rose-950/80 hover:bg-rose-900/80 text-rose-300 text-xs font-semibold rounded-xl border border-rose-500/40 transition shadow">
                    🗑️ Clear All Scans
                </button>
            </div>
        </div>

        <!-- Search & Filter Controls -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
            <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Filter by name, company, or phone..." 
                   class="px-3.5 py-2 text-sm bg-slate-950 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 text-white placeholder-slate-500">
            <select id="districtFilter" onchange="applyFilters()" class="px-3 py-2 text-sm bg-slate-950 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 text-white">
                <option value="">All Districts</option>
                <option value="Ernakulam">Ernakulam</option>
                <option value="Thiruvananthapuram">Thiruvananthapuram</option>
                <option value="Thrissur">Thrissur</option>
                <option value="Kozhikode">Kozhikode</option>
                <option value="Kollam">Kollam</option>
                <option value="Kottayam">Kottayam</option>
                <option value="Palakkad">Palakkad</option>
                <option value="Malappuram">Malappuram</option>
                <option value="Kannur">Kannur</option>
                <option value="Alappuzha">Alappuzha</option>
            </select>
            <select id="desigFilter" onchange="applyFilters()" class="px-3 py-2 text-sm bg-slate-950 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 text-white">
                <option value="">All Designations</option>
                <option value="Member">Member</option>
                <option value="State Executive Member">State Executive Member</option>
                <option value="Distributor">Distributor</option>
                <option value="Vendor">Vendor</option>
                <option value="Guest">Guest</option>
            </select>
        </div>

        <!-- Professional Dark Table -->
        <div class="overflow-x-auto rounded-2xl border border-slate-800">
            <table class="w-full min-w-full divide-y divide-slate-800/80 text-left text-sm">
                <thead class="bg-slate-950 text-emerald-400 text-xs font-bold uppercase tracking-wider border-b border-slate-800">
                    <tr>
                        <th class="py-3 px-4">#</th>
                        <th class="py-3 px-4">Name</th>
                        <th class="py-3 px-4">Company</th>
                        <th class="py-3 px-4">Designation</th>
                        <th class="py-3 px-4">Phone</th>
                        <th class="py-3 px-4">District</th>
                        <th class="py-3 px-4">Scanned At</th>
                        <th class="py-3 px-4 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody" class="divide-y divide-slate-800/80">
                    <tr>
                        <td colspan="8" class="p-8 text-center text-slate-500">Loading attendance data...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Script connected to local backend API -->
    <script>
        let allScans = [];

        async function loadScannedData() {
            const btn = document.getElementById('fetchDataBtn');
            btn.disabled = true;
            btn.textContent = 'Loading...';

            try {
                const res = await fetch('/api/scans');
                const data = await res.json();
                allScans = data.scans || [];
                document.getElementById('totalScanBadge').textContent = allScans.length;
                applyFilters();
            } catch (err) {
                console.error(err);
                document.getElementById('dataTableBody').innerHTML = `<tr><td colspan="8" class="p-8 text-center text-rose-400">Failed to load data from server.</td></tr>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 Refresh Data';
            }
        }

        function applyFilters() {
            const q = (document.getElementById('searchInput').value || '').toLowerCase();
            const dist = document.getElementById('districtFilter').value;
            const desig = document.getElementById('desigFilter').value;

            const filtered = allScans.filter(s => {
                const matchQ = !q || (s.name || '').toLowerCase().includes(q) || (s.company || '').toLowerCase().includes(q) || (s.phone || '').includes(q);
                const matchDist = !dist || s.district === dist;
                const matchDesig = !desig || s.designation === desig;
                return matchQ && matchDist && matchDesig;
            });

            renderTable(filtered);
        }

        function renderTable(scans) {
            const tbody = document.getElementById('dataTableBody');
            if (scans.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-slate-500">No scanned attendance records found.</td></tr>`;
                return;
            }

            tbody.innerHTML = scans.map((s, idx) => `
                <tr class="hover:bg-slate-800/60 transition text-slate-200">
                    <td class="py-3 px-4 font-mono text-xs text-slate-500">${idx + 1}</td>
                    <td class="py-3 px-4 font-bold text-white">${s.name}</td>
                    <td class="py-3 px-4 text-slate-300">${s.company}</td>
                    <td class="py-3 px-4"><span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-orange-950 text-orange-400 border border-orange-800/60">${s.designation || 'Member'}</span></td>
                    <td class="py-3 px-4 font-mono text-xs text-cyan-400">${s.phone || '-'}</td>
                    <td class="py-3 px-4 text-slate-400">${s.district || 'Ernakulam'}</td>
                    <td class="py-3 px-4 text-xs text-slate-400 font-mono">${s.scanned_at}</td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="deleteScan(${s.id})" title="Delete entry" class="text-rose-400 hover:text-rose-300 hover:bg-rose-950/60 px-2 py-1 rounded transition text-xs">
                            🗑️ Delete
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteScan(id) {
            if (!confirm('Are you sure you want to delete this scan entry?')) return;
            try {
                const res = await fetch(`/api/scans/${id}`, { method: 'DELETE' });
                const d = await res.json();
                if (d.status === 'success') {
                    loadScannedData();
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function confirmDeleteAll() {
            if (!confirm('⚠️ Are you sure you want to delete ALL scans? This action cannot be undone.')) return;
            try {
                const res = await fetch('/api/scans/clear', { method: 'POST' });
                const d = await res.json();
                if (d.status === 'success') {
                    loadScannedData();
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadScannedData);
    </script>
</body>
</html>
